name: 'CI setup'
description: 'Set up the environment for CI runs.'
runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    # Pinned to 11.x: npm 12 made `npm view --json` always return an array,
    # which breaks `changeset publish` (pnpm forwards `pnpm info` to npm).
    # See https://github.com/npm/cli/releases/tag/v12.0.0
    - name: Update npm
      run: npm install -g npm@^11
      shell: bash

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile=false
      shell: bash